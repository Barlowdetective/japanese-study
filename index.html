<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="日本語 Study"/>
<meta name="theme-color" content="#c0392b"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>日本語 Study — N4/N5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a0a0a;color:#f1f5f9;min-height:100vh;}
.app{min-height:100vh;background:linear-gradient(160deg,#1a0a0a 0%,#2d0a0a 60%,#1a0a1a 100%);}
.header{background:rgba(0,0,0,0.5);backdrop-filter:blur(14px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(192,57,43,0.25);position:sticky;top:0;z-index:100;}
.logo-jp{font-size:20px;font-weight:900;color:#e74c3c;letter-spacing:2px;}
.logo-en{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:1px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.streak-badge{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.35);border-radius:20px;padding:4px 10px;font-size:12px;color:#e74c3c;font-weight:700;}
.icon-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.6);font-size:14px;padding:5px 9px;cursor:pointer;}
.progress-bar{height:3px;background:rgba(255,255,255,0.06);}
.progress-fill{height:100%;background:linear-gradient(90deg,#c0392b,#e74c3c);transition:width 0.4s;}
.day-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.06);}
.day-label{font-size:13px;font-weight:700;color:#e74c3c;}
.day-nav{display:flex;gap:6px;align-items:center;}
.day-nav-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.5);padding:4px 12px;cursor:pointer;font-size:12px;font-weight:600;}
.day-nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.tabs{display:flex;padding:0 14px;gap:3px;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.3);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{border:none;background:transparent;color:rgba(255,255,255,0.4);padding:10px 13px;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;font-weight:500;}
.tab-btn.active{color:#e74c3c;border-bottom-color:#c0392b;font-weight:700;}
.score-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:rgba(0,0,0,0.2);border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;color:rgba(255,255,255,0.4);}
.score-val{color:#fbbf24;font-weight:700;}
.content{padding:14px 14px 40px;}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px);}
.flashcard-wrap{perspective:1000px;height:210px;cursor:pointer;margin-bottom:14px;}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.5s;}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;}
.fc-front{background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.25);}
.fc-back{background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);transform:rotateY(180deg);}
.fc-kanji{font-size:54px;font-weight:900;color:#fff;line-height:1;}
.fc-reading{font-size:15px;color:rgba(255,255,255,0.5);letter-spacing:2px;}
.fc-hint{font-size:12px;color:rgba(255,255,255,0.25);margin-top:4px;}
.fc-meaning{font-size:22px;font-weight:700;color:#f1f5f9;text-align:center;}
.fc-example{font-size:13px;color:rgba(255,255,255,0.55);text-align:center;line-height:1.6;}
.fc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.fc-counter{font-size:13px;color:rgba(255,255,255,0.4);}
.fc-nav-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.6);padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;}
.fc-nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.view-toggle{display:flex;gap:6px;margin-bottom:14px;}
.vt-btn{flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.vt-btn.active{background:rgba(192,57,43,0.2);border-color:#c0392b;color:#e74c3c;}
.vocab-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;margin-bottom:8px;}
.vi-kanji{font-size:26px;font-weight:900;color:#fff;min-width:44px;text-align:center;}
.vi-reading{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:1px;}
.vi-meaning{font-size:14px;font-weight:600;color:#f1f5f9;}
.vi-example{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;line-height:1.5;}
.speak-btn{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.25);border-radius:8px;color:#e74c3c;padding:6px 10px;cursor:pointer;font-size:14px;flex-shrink:0;}
.grammar-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:18px;margin-bottom:14px;}
.gc-pattern{font-size:19px;font-weight:800;color:#e74c3c;margin-bottom:5px;}
.gc-meaning{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:10px;}
.gc-label{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.gc-example{background:rgba(0,0,0,0.2);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.gc-jp{font-size:15px;color:#f1f5f9;line-height:1.6;}
.gc-en{font-size:13px;color:rgba(255,255,255,0.45);margin-top:3px;}
.reading-passage{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;margin-bottom:14px;font-size:15px;line-height:2.2;color:#f1f5f9;}
.quiz-jp{font-size:22px;font-weight:700;color:#fff;margin-bottom:12px;text-align:center;letter-spacing:1px;}
.quiz-question{font-size:14px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:12px;}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.quiz-opt{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 16px;text-align:left;color:#f1f5f9;font-size:14px;cursor:pointer;transition:all 0.2s;width:100%;}
.quiz-opt.correct{background:rgba(52,211,153,0.15);border-color:#34d399;color:#34d399;}
.quiz-opt.wrong{background:rgba(248,113,113,0.15);border-color:#f87171;color:#f87171;}
.quiz-opt:disabled{cursor:not-allowed;}
.quiz-result{text-align:center;padding:10px;font-size:14px;font-weight:600;border-radius:10px;margin-bottom:10px;}
.quiz-result.correct{background:rgba(52,211,153,0.1);color:#34d399;border:1px solid rgba(52,211,153,0.2);}
.quiz-result.wrong{background:rgba(248,113,113,0.1);color:#f87171;border:1px solid rgba(248,113,113,0.2);}
.next-btn{width:100%;background:linear-gradient(135deg,#c0392b,#922b21);border:none;border-radius:10px;padding:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.listen-card{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;margin-bottom:14px;text-align:center;}
.listen-play-btn{background:linear-gradient(135deg,#c0392b,#922b21);border:none;border-radius:50px;padding:12px 28px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:14px;}
.show-trans-btn{background:transparent;border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:rgba(255,255,255,0.4);font-size:12px;padding:6px 14px;cursor:pointer;}
.mark-btn{width:100%;background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.25);border-radius:10px;color:#e74c3c;padding:11px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;}
.settings-panel{position:fixed;top:0;right:0;bottom:0;width:280px;background:#1a0a0a;border-left:1px solid rgba(255,255,255,0.08);z-index:200;padding:22px 18px;display:flex;flex-direction:column;gap:14px;transform:translateX(100%);transition:transform 0.3s;overflow-y:auto;}
.settings-panel.open{transform:translateX(0);}
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:199;display:none;}
.settings-overlay.open{display:block;}
.s-title{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.s-close{background:none;border:none;color:rgba(255,255,255,0.4);font-size:20px;cursor:pointer;}
.s-label{font-size:11px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.s-stat{background:rgba(255,255,255,0.04);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.s-stat-val{color:#fbbf24;font-weight:700;}
.s-btn{width:100%;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid;margin-top:6px;}
</style>
</head>
<body>
<div class="settings-overlay" id="sOverlay" onclick="closeSett()"></div>
<div class="settings-panel" id="sPanel">
  <div class="s-title"><span>⚙ Settings</span><button class="s-close" onclick="closeSett()">×</button></div>
  <div>
    <div class="s-label">Study Stats</div>
    <div class="s-stat"><span>🔥 Streak</span><span class="s-stat-val" id="stStreak">0 days</span></div>
    <div class="s-stat"><span>⭐ Total Score</span><span class="s-stat-val" id="stScore">0 pts</span></div>
    <div class="s-stat"><span>📅 Current Day</span><span class="s-stat-val" id="stDay">Day 1</span></div>
  </div>
  <div>
    <div class="s-label">🔊 TTS Voice Test</div>
    <div id="voiceList" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px;font-size:12px;color:rgba(255,255,255,0.5);line-height:1.7">Tap ⚙ to check voices</div>
    <button class="s-btn" style="background:rgba(52,211,153,0.1);border-color:#34d399;color:#34d399" onclick="testSpeak()">▶ Test Japanese Voice</button>
  </div>
  <div style="margin-top:auto;">
    <button class="s-btn" style="background:rgba(248,113,113,0.1);border-color:#f87171;color:#f87171" onclick="clearAll()">✕ Reset All Progress</button>
  </div>
</div>

<div class="app" id="app">
  <div class="header">
    <div><div class="logo-jp">日本語</div><div class="logo-en">N4 / N5 · 30-DAY COURSE</div></div>
    <div class="hdr-right">
      <div class="streak-badge" id="streakBadge">🔥 0</div>
      <button class="icon-btn" onclick="openSett()">⚙</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="pFill" style="width:0%"></div></div>
  <div class="day-bar">
    <span class="day-label" id="dayLabel">📅 Day 1 / 30</span>
    <div class="day-nav">
      <button class="day-nav-btn" id="prevDay" onclick="changeDay(-1)">← Prev</button>
      <button class="day-nav-btn" id="nextDay" onclick="changeDay(1)">Next →</button>
      <button class="day-nav-btn" onclick="openDayPicker()" style="background:rgba(251,191,36,0.15);border-color:#fbbf24;color:#fbbf24">📅 Jump</button>
    </div>
  </div>

  <!-- Day Picker Modal -->
  <div id="dayPickerOverlay" onclick="closeDayPicker()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;align-items:center;justify-content:center;">
    <div onclick="event.stopPropagation()" style="background:#1e1010;border:1px solid rgba(192,57,43,0.3);border-radius:20px;padding:24px;width:90%;max-width:340px;max-height:80vh;overflow-y:auto;">
      <div style="font-size:15px;font-weight:700;color:#e74c3c;margin-bottom:16px;text-align:center">📅 Select Day</div>
      <div id="dayGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;"></div>
      <button onclick="closeDayPicker()" style="width:100%;margin-top:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.5);padding:10px;cursor:pointer;font-size:13px;font-weight:600">Cancel</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tb-vocab"     onclick="switchTab('vocab')">📚 Vocab</button>
    <button class="tab-btn"        id="tb-grammar"   onclick="switchTab('grammar')">📝 Grammar</button>
    <button class="tab-btn"        id="tb-reading"   onclick="switchTab('reading')">📖 Reading</button>
    <button class="tab-btn"        id="tb-listening" onclick="switchTab('listening')">🎧 Listening</button>
    <button class="tab-btn"        id="tb-quiz"      onclick="switchTab('quiz')">✅ Quiz</button>
  </div>
  <div class="score-bar">
    <span>Score: <span class="score-val" id="scoreDisp">0</span> pts</span>
    <span id="dateDisp" style="font-size:11px;color:rgba(255,255,255,0.25)"></span>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// 30-DAY N4/N5 LESSON DATABASE
// ═══════════════════════════════════════════════
const LESSONS = [
// ── DAY 1 ──
{
  vocab:[
    {k:"食べる",r:"たべる",m:"to eat",e:"毎日ご飯を食べます。",ee:"I eat rice every day."},
    {k:"飲む",r:"のむ",m:"to drink",e:"水を飲みます。",ee:"I drink water."},
    {k:"行く",r:"いく",m:"to go",e:"学校に行きます。",ee:"I go to school."},
    {k:"来る",r:"くる",m:"to come",e:"友達が来ます。",ee:"My friend comes."},
    {k:"見る",r:"みる",m:"to see/watch",e:"テレビを見ます。",ee:"I watch TV."},
    {k:"大きい",r:"おおきい",m:"big",e:"大きい犬がいます。",ee:"There is a big dog."},
    {k:"小さい",r:"ちいさい",m:"small",e:"小さい猫です。",ee:"It's a small cat."},
    {k:"友達",r:"ともだち",m:"friend",e:"友達と話します。",ee:"I talk with my friend."},
    {k:"電車",r:"でんしゃ",m:"train",e:"電車で行きます。",ee:"I go by train."},
    {k:"毎日",r:"まいにち",m:"every day",e:"毎日勉強します。",ee:"I study every day."},
  ],
  grammar:[
    {p:"〜たい",m:"Want to do ~",ex:"〜たい attaches to verb stem to express desire.",examples:[{j:"日本に行きたいです。",e:"I want to go to Japan."},{j:"寿司を食べたい。",e:"I want to eat sushi."}]},
    {p:"〜ている",m:"Is doing / ongoing state",ex:"Te-form + いる shows ongoing action or state.",examples:[{j:"今、本を読んでいます。",e:"I am reading a book now."},{j:"彼は結婚しています。",e:"He is married."}]},
    {p:"〜から",m:"Because / From",ex:"から can mean 'because' or 'from' (starting point).",examples:[{j:"雨だから、家にいます。",e:"Because it's raining, I'm home."},{j:"9時から働きます。",e:"I work from 9 o'clock."}]},
  ],
  reading:{title:"私の一日",passage:"私は毎朝6時に起きます。朝ごはんはパンとコーヒーです。電車で会社に行きます。昼ごはんは友達と食べます。夜はテレビを見て、11時に寝ます。",tr:"I wake up at 6am every morning. Breakfast is bread and coffee. I go to work by train. I eat lunch with friends. At night I watch TV and sleep at 11pm.",q:{q:"What time does this person wake up?",a:"6am",opts:["5am","6am","7am","8am"]}},
  listening:[
    {t:"今日は天気がいいですね。",tr:"The weather is nice today.",q:"What is being described?",opts:["The food","The weather","The work","The train"],a:"The weather"},
    {t:"すみません、駅はどこですか。",tr:"Excuse me, where is the station?",q:"What is the person looking for?",opts:["Restaurant","Toilet","Station","Hotel"],a:"Station"},
    {t:"このりんごはいくらですか。",tr:"How much is this apple?",q:"What is being asked?",opts:["Color","Taste","Size","Price"],a:"Price"},
    {t:"明日、友達と映画を見に行きます。",tr:"Tomorrow I'll see a movie with a friend.",q:"What will the person do tomorrow?",opts:["Study","Shopping","See a movie","Cook"],a:"See a movie"},
  ]
},
// ── DAY 2 ──
{
  vocab:[
    {k:"話す",r:"はなす",m:"to speak",e:"日本語で話します。",ee:"I speak in Japanese."},
    {k:"書く",r:"かく",m:"to write",e:"手紙を書きます。",ee:"I write a letter."},
    {k:"読む",r:"よむ",m:"to read",e:"本を読みます。",ee:"I read a book."},
    {k:"聞く",r:"きく",m:"to listen/ask",e:"音楽を聞きます。",ee:"I listen to music."},
    {k:"買う",r:"かう",m:"to buy",e:"スーパーで野菜を買います。",ee:"I buy vegetables at the supermarket."},
    {k:"新しい",r:"あたらしい",m:"new",e:"新しい車を買いました。",ee:"I bought a new car."},
    {k:"古い",r:"ふるい",m:"old",e:"古い建物です。",ee:"It's an old building."},
    {k:"高い",r:"たかい",m:"expensive/tall",e:"この店は高いです。",ee:"This shop is expensive."},
    {k:"安い",r:"やすい",m:"cheap",e:"安いレストランです。",ee:"It's a cheap restaurant."},
    {k:"近い",r:"ちかい",m:"near/close",e:"駅が近いです。",ee:"The station is close."},
  ],
  grammar:[
    {p:"〜てください",m:"Please do ~",ex:"Te-form + ください is used to make polite requests.",examples:[{j:"ここに名前を書いてください。",e:"Please write your name here."},{j:"静かにしてください。",e:"Please be quiet."}]},
    {p:"〜ましょう",m:"Let's ~ / Shall we ~",ex:"Attach ましょう to verb stem to suggest doing something together.",examples:[{j:"一緒に行きましょう。",e:"Let's go together."},{j:"休みましょう。",e:"Let's rest."}]},
    {p:"〜ませんか",m:"Would you like to ~?",ex:"Polite invitation form using verb stem + ませんか.",examples:[{j:"映画を見ませんか。",e:"Would you like to watch a movie?"},{j:"一緒に食べませんか。",e:"Would you like to eat together?"}]},
  ],
  reading:{title:"週末の計画",passage:"今週末、友達と買い物に行きます。デパートで新しい服を買いたいです。それから、安いレストランで昼ごはんを食べます。電車で行くので、近い駅で待ち合わせます。",tr:"This weekend I'll go shopping with friends. I want to buy new clothes at the department store. After that, we'll eat lunch at a cheap restaurant. Since we're going by train, we'll meet at the nearest station.",q:{q:"Where will they meet?",a:"At the nearest station",opts:["At the department store","At the restaurant","At the nearest station","At home"]}},
  listening:[
    {t:"明日は何時に起きますか。",tr:"What time will you wake up tomorrow?",q:"What is being asked?",opts:["Wake up time","Sleep time","Work time","Eat time"],a:"Wake up time"},
    {t:"このケーキはとても美味しいです。",tr:"This cake is very delicious.",q:"What is being described?",opts:["A drink","A cake","A book","A movie"],a:"A cake"},
    {t:"図書館はどこですか。",tr:"Where is the library?",q:"What is the person asking about?",opts:["The park","The library","The school","The hospital"],a:"The library"},
    {t:"来週、日本語のテストがあります。",tr:"There is a Japanese test next week.",q:"When is the test?",opts:["This week","Tomorrow","Next week","Next month"],a:"Next week"},
  ]
},
// ── DAY 3 ──
{
  vocab:[
    {k:"起きる",r:"おきる",m:"to wake up",e:"6時に起きます。",ee:"I wake up at 6."},
    {k:"寝る",r:"ねる",m:"to sleep/go to bed",e:"11時に寝ます。",ee:"I sleep at 11."},
    {k:"働く",r:"はたらく",m:"to work",e:"毎日働きます。",ee:"I work every day."},
    {k:"休む",r:"やすむ",m:"to rest/take a day off",e:"今日は休みます。",ee:"I'll rest today."},
    {k:"勉強する",r:"べんきょうする",m:"to study",e:"日本語を勉強します。",ee:"I study Japanese."},

// APP STATE
// ═══════════════════════════════════════════════
const PS='jp_prog2';
const sto={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  clear(){try{localStorage.clear();}catch(e){}}
};

let progress={score:0,streak:0,lastDate:'',totalScore:0,done:{},currentDay:0};
let activeTab='vocab';
let vocabView='flashcard';
let fcIdx=0,fcFlipped=false;
let listenIdx=0,listenAnswered=false,listenTrShow=false;
let quizQ=[],quizIdx=0,quizAnswered=false,quizScore=0;

// ── Boot ──
(function init(){
  loadProg();
  updateUI();
  buildQuiz();
  renderTab();
  document.getElementById('dateDisp').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
})();

// ── Progress ──
function loadProg(){
  try{const p=sto.get(PS);if(p)progress=JSON.parse(p);}catch(e){}
  const today=new Date().toDateString();
  if(progress.lastDate!==today){
    progress.score=0;
    progress.done={};
    progress.lastDate=today;
    // Auto advance day each new day
    if(progress.streak>0) progress.currentDay=Math.min(29,progress.currentDay+1);
    saveProg();
  }
}
function saveProg(){sto.set(PS,JSON.stringify(progress));}
function addScore(n){
  progress.score+=n;progress.totalScore+=n;
  progress.done[activeTab]=true;
  const keys=Object.keys(progress.done).length;
  if(keys>=3) progress.streak=Math.max(progress.streak,1);
  saveProg();updateUI();
}
function updateUI(){
  document.getElementById('scoreDisp').textContent=progress.score;
  document.getElementById('streakBadge').textContent='🔥 '+progress.streak;
  document.getElementById('pFill').style.width=Math.min(100,Object.keys(progress.done).length*20)+'%';
  const d=progress.currentDay||0;
  document.getElementById('dayLabel').textContent=`📅 Day ${d+1} / 30`;
  document.getElementById('prevDay').disabled=d===0;
  document.getElementById('nextDay').disabled=d===29;
}

function changeDay(dir){
  const nd=(progress.currentDay||0)+dir;
  if(nd<0||nd>29)return;
  progress.currentDay=nd;
  fcIdx=0;fcFlipped=false;listenIdx=0;listenAnswered=false;listenTrShow=false;
  progress.done={};
  progress.score=0;
  saveProg();updateUI();buildQuiz();renderTab();
}

function getLesson(){return LESSONS[progress.currentDay||0];}

// ── Tabs ──
function switchTab(t){
  activeTab=t;fcIdx=0;fcFlipped=false;listenIdx=0;listenAnswered=false;listenTrShow=false;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tb-'+t).classList.add('active');
  renderTab();
}
function renderTab(){
  updateUI();
  const l=getLesson();
  if(activeTab==='vocab')renderVocab(l);
  else if(activeTab==='grammar')renderGrammar(l);
  else if(activeTab==='reading')renderReading(l);
  else if(activeTab==='listening')renderListening(l);
  else if(activeTab==='quiz')renderQuiz();
}

    ${i.examples.map(e=>`<div class="gc-example">
      <div class="gc-jp">${e.j} <button onclick="speak('${esc(e.j)}')" style="background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.2);border-radius:6px;color:#e74c3c;padding:2px 8px;cursor:pointer;font-size:11px;margin-left:4px">🔊</button></div>
      <div class="gc-en">${e.e}</div>
    </div>`).join('')}
  </div>`).join('');
  h+=`<button class="mark-btn" onclick="addScore(5)">✓ Mark Grammar Complete (+5 pts)</button>`;
  document.getElementById('content').innerHTML=h;
}

// ── Reading ──
function renderReading(l){
  const r=l.reading;
  const done=progress.done['reading_q'];
  // Split passage into sentences for per-sentence pronunciation
  const sentences=r.passage.match(/[^。！？]+[。！？]/g)||[r.passage];
  const passageHTML=sentences.map((s,i)=>
    `<span style="display:inline">${s}
      <button onclick="speak('${esc(s)}')" style="background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.2);border-radius:5px;color:#e74c3c;padding:1px 7px;cursor:pointer;font-size:11px;vertical-align:middle;margin:0 2px 4px">🔊</button>
    </span>`
  ).join(' ');

  let h=`<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:11px;font-weight:700;color:#e74c3c;text-transform:uppercase;letter-spacing:1px">📖 ${r.title}</div>
      <button onclick="speak('${esc(r.passage)}')" style="background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.25);border-radius:8px;color:#e74c3c;padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap">🔊 Read All</button>
    </div>
    <div class="reading-passage" style="line-height:2.6">${passageHTML}</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button id="transBtn" onclick="var e=document.getElementById('trans');var b=document.getElementById('transBtn');if(e.style.display==='none'){e.style.display='block';b.textContent='Hide Translation';addScore(1);}else{e.style.display='none';b.textContent='Show Translation'}" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:rgba(255,255,255,0.5);padding:8px 16px;cursor:pointer;font-size:13px">Show Translation</button>
      <button onclick="speak('${esc(r.passage)}');addScore(1)" style="background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.2);border-radius:8px;color:#e74c3c;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600">🔊 Listen Again</button>
    </div>
    <div id="trans" style="display:none;background:rgba(0,0,0,0.2);border-radius:10px;padding:12px;font-size:13px;color:rgba(255,255,255,0.5);line-height:1.7">${r.tr}</div>
  </div>
  <div class="card">
    <div class="quiz-question">❓ ${r.q.q}</div>
    <div class="quiz-options">${r.q.opts.map(o=>`<button class="quiz-opt${done&&o===r.q.a?' correct':done?' wrong':''}" onclick="answerReading(this,'${esc(o)}','${esc(r.q.a)}')" ${done?'disabled':''}>${o}</button>`).join('')}</div>
    ${done?`<div class="quiz-result correct">✓ ${r.q.a}</div>`:''}
  </div>`;
  document.getElementById('content').innerHTML=h;
}
function answerReading(btn,chosen,correct){
  document.querySelectorAll('.quiz-opt').forEach(b=>{b.disabled=true;b.className='quiz-opt '+(b.textContent.trim()===correct?'correct':'wrong');});
  if(chosen===correct){addScore(10);progress.done['reading_q']=true;saveProg();}
}

// ── Listening ──
function renderListening(l){
  const items=l.listening||[];
  const item=items[listenIdx];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span style="font-size:13px;color:rgba(255,255,255,0.4)">${listenIdx+1} / ${items.length}</span>
    <div style="display:flex;gap:6px">
      <button onclick="if(listenIdx>0){listenIdx--;listenAnswered=false;listenTrShow=false;renderTab()}" ${listenIdx===0?'disabled':''} style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:7px;color:rgba(255,255,255,0.5);padding:5px 12px;cursor:pointer;font-size:12px">← Prev</button>
      <button onclick="if(listenIdx<${items.length-1}){listenIdx++;listenAnswered=false;listenTrShow=false;renderTab()}" ${listenIdx===items.length-1?'disabled':''} style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:7px;color:rgba(255,255,255,0.5);padding:5px 12px;cursor:pointer;font-size:12px">Next →</button>
    </div>
  </div>
  <div class="listen-card">
    <div style="font-size:40px;margin-bottom:10px">🎧</div>
    <p style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:14px">Listen carefully then answer below</p>
    <button class="listen-play-btn" onclick="speak('${esc(item.t)}');addScore(1)">▶ Play Audio</button><br/>
    <button class="show-trans-btn" onclick="listenTrShow=!listenTrShow;document.getElementById('ltr').style.display=listenTrShow?'block':'none';this.textContent=listenTrShow?'Hide Text':'Show Text'">Show Text</button>
    <div id="ltr" style="display:none;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;margin-top:10px;text-align:left">
      <div style="font-size:16px;margin-bottom:5px">${item.t}</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.4)">${item.tr}</div>
    </div>
  </div>
  <div class="card">
    <div class="quiz-question">❓ ${item.q}</div>
    <div class="quiz-options">${item.opts.map(o=>`<button class="quiz-opt${listenAnswered&&o===item.a?' correct':listenAnswered?' wrong':''}" onclick="answerListen(this,'${esc(o)}','${esc(item.a)}')" ${listenAnswered?'disabled':''}>${o}</button>`).join('')}</div>
    ${listenAnswered?`<div class="quiz-result correct">✓ ${item.a}</div>`:''}
  </div>`;
  document.getElementById('content').innerHTML=h;
}
function answerListen(btn,chosen,correct){
  listenAnswered=true;
  document.querySelectorAll('.quiz-opt').forEach(b=>{b.disabled=true;b.className='quiz-opt '+(b.textContent.trim()===correct?'correct':'wrong');});
  if(chosen===correct)addScore(8);
}

// ── Quiz ──
function buildQuiz(){
  const l=getLesson();
  quizQ=[];
  l.vocab.slice(0,5).forEach(w=>{
    const wrong=l.vocab.filter(x=>x.k!==w.k).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.m);
    quizQ.push({type:'vocab',jp:w.k+' ('+w.r+')',q:'What does this mean?',a:w.m,opts:[w.m,...wrong].sort(()=>Math.random()-0.5)});
  });
  l.listening.forEach(i=>quizQ.push({type:'listen',jp:i.t,q:i.q,a:i.a,opts:i.opts}));
  quizQ=quizQ.sort(()=>Math.random()-0.5);
  quizIdx=0;quizAnswered=false;quizScore=0;
}
function renderQuiz(){
  if(quizIdx>=quizQ.length){
    const pct=Math.round(quizScore/quizQ.length*100);
    document.getElementById('content').innerHTML=`<div style="text-align:center;padding:50px 20px">
      <div style="font-size:60px;margin-bottom:14px">${pct>=70?'🎉':'📚'}</div>
      <div style="font-size:28px;font-weight:900;color:#e74c3c;margin-bottom:8px">${quizScore}/${quizQ.length}</div>
      <div style="font-size:15px;color:rgba(255,255,255,0.5);margin-bottom:24px">${pct>=70?'よくできました！Great job!':'もっと練習！Keep practicing!'}</div>
      <button onclick="buildQuiz();renderQuiz()" style="background:linear-gradient(135deg,#c0392b,#922b21);border:none;border-radius:12px;padding:13px 30px;color:#fff;font-size:15px;font-weight:700;cursor:pointer">🔄 Try Again</button>
    </div>`;
    addScore(quizScore*5);return;
  }
  const q=quizQ[quizIdx];
  document.getElementById('content').innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:13px;color:rgba(255,255,255,0.4)">Q ${quizIdx+1}/${quizQ.length}</span>
      <span style="font-size:13px;color:#fbbf24;font-weight:700">Score: ${quizScore}</span>
    </div>
    <div class="card">
      <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">${q.type==='vocab'?'📚 Vocabulary':'🎧 Listening'}</div>
      ${q.type==='listen'?`<button onclick="speak('${esc(q.jp)}')" style="background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.25);border-radius:8px;color:#e74c3c;padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;margin-bottom:12px">▶ Play Audio</button><br/>`:''}
      <div class="quiz-jp">${q.jp}</div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options">${q.opts.map(o=>`<button class="quiz-opt" onclick="answerQuiz(this,'${esc(o)}','${esc(q.a)}')">${o}</button>`).join('')}</div>
    </div>`;
}
function answerQuiz(btn,chosen,correct){
  if(quizAnswered)return;
  quizAnswered=true;
  document.querySelectorAll('.quiz-opt').forEach(b=>{b.disabled=true;b.className='quiz-opt '+(b.textContent.trim()===correct?'correct':'wrong');});
  if(chosen===correct)quizScore++;
  const res=document.createElement('div');
  res.className='quiz-result '+(chosen===correct?'correct':'wrong');
  res.textContent=chosen===correct?'✓ Correct! +5 pts':'✗ Answer: '+correct;
  const nb=document.createElement('button');
  nb.className='next-btn';
  nb.textContent=quizIdx+1<quizQ.length?'Next Question →':'See Results';
  nb.onclick=()=>{quizIdx++;quizAnswered=false;renderQuiz();};
  document.querySelector('.quiz-options').after(res);res.after(nb);
}

function openDayPicker(){
  const grid=document.getElementById('dayGrid');
  const cur=progress.currentDay||0;
  grid.innerHTML='';
  for(let i=0;i<30;i++){
    const btn=document.createElement('button');
    btn.textContent=i+1;
    btn.style.cssText=`padding:10px 0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid;transition:all 0.2s;
      background:${i===cur?'#c0392b':'rgba(255,255,255,0.05)'};
      border-color:${i===cur?'#c0392b':'rgba(255,255,255,0.1)'};
      color:${i===cur?'#fff':'rgba(255,255,255,0.6)'};`;
    btn.onclick=()=>jumpToDay(i);
    grid.appendChild(btn);
  }
  document.getElementById('dayPickerOverlay').style.display='flex';
}
function closeDayPicker(){
  document.getElementById('dayPickerOverlay').style.display='none';
}
function jumpToDay(d){
  progress.currentDay=d;
  fcIdx=0;fcFlipped=false;listenIdx=0;listenAnswered=false;listenTrShow=false;
  progress.done={};
  progress.score=0;
  saveProg();updateUI();buildQuiz();renderTab();
  closeDayPicker();
}
function openSett(){
  document.getElementById('stStreak').textContent=progress.streak+' days';
  document.getElementById('stScore').textContent=progress.totalScore+' pts';
  document.getElementById('stDay').textContent='Day '+(progress.currentDay+1);
  const voices=window.speechSynthesis?window.speechSynthesis.getVoices():[];
  const jpVoices=voices.filter(v=>v.lang.startsWith('ja'));
  const vDiv=document.getElementById('voiceList');
  vDiv.innerHTML=jpVoices.length>0
    ?'<div style="color:#34d399;margin-bottom:4px">✅ Japanese voices ('+jpVoices.length+'):</div>'+jpVoices.map(v=>`<div style="font-size:11px;color:rgba(255,255,255,0.6);padding:1px 0">• ${v.name} (${v.lang})</div>`).join('')
    :'<div style="color:#f87171">❌ No Japanese voice found</div><div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:4px">Install Japanese TTS in phone Settings</div>';
  document.getElementById('sPanel').classList.add('open');
  document.getElementById('sOverlay').classList.add('open');
}
function closeSett(){document.getElementById('sPanel').classList.remove('open');document.getElementById('sOverlay').classList.remove('open');}
function clearAll(){if(!confirm('Reset all progress?'))return;sto.clear();location.reload();}

function testSpeak(){
  const voices=window.speechSynthesis?window.speechSynthesis.getVoices():[];
  const jp=voices.find(v=>v.lang==='ja-JP')||voices.find(v=>v.lang.startsWith('ja'));
  if(!jp){alert('No Japanese voice found.\n\nGo to Settings → Accessibility → Text to Speech → install Japanese language.');return;}
  const u=new SpeechSynthesisUtterance('こんにちは！日本語の勉強を頑張りましょう！');
  u.lang='ja-JP';u.rate=0.85;u.voice=jp;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  alert('Playing: こんにちは！\nVoice: '+jp.name);
}

// ── Speech ──
const isPreview=window.self!==window.top;
function speak(txt){
  if(!txt)return;
  if(isPreview){showToast(txt);return;}
  if(!window.speechSynthesis){showToast(txt);return;}
  window.speechSynthesis.cancel();
  const go=()=>{
    const voices=window.speechSynthesis.getVoices();
    const jp=voices.find(v=>v.lang==='ja-JP'&&v.localService)||voices.find(v=>v.lang==='ja-JP')||voices.find(v=>v.lang.startsWith('ja'))||voices.find(v=>v.name.includes('Kyoko'))||voices.find(v=>v.name.includes('Otoya'))||null;
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='ja-JP';u.rate=0.8;u.pitch=1;
    if(jp)u.voice=jp;
    else{showToast(txt,'No Japanese voice found. Install Japanese TTS in Settings.');return;}
    u.onerror=()=>showToast(txt,'Speech error. Check TTS settings.');
    window.speechSynthesis.speak(u);
  };
  const v=window.speechSynthesis.getVoices();
  if(v.length>0)go();
  else{window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;go();};setTimeout(go,500);}
}
function speakFB(txt,btnId){
  const btn=document.getElementById(btnId);
  if(btn){const o=btn.innerHTML;btn.innerHTML='🔈 Playing…';btn.style.opacity='0.6';setTimeout(()=>{btn.innerHTML=o;btn.style.opacity='1';},2500);}
  speak(txt);
}
function showToast(txt,extra){
  let t=document.getElementById('spToast');
  if(!t){t=document.createElement('div');t.id='spToast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid rgba(248,113,113,0.3);border-radius:14px;padding:14px 20px;font-size:14px;color:#f1f5f9;z-index:9999;text-align:center;max-width:88%;box-shadow:0 8px 32px rgba(0,0,0,0.5);transition:opacity 0.3s;';document.body.appendChild(t);}
  t.innerHTML=`<div style="font-size:22px;letter-spacing:3px;color:#e74c3c;margin-bottom:5px">${txt}</div><div style="font-size:11px;color:rgba(255,255,255,0.35)">${extra||'🔊 Audio plays on your phone'}</div>`;
  t.style.display='block';t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.style.display='none',300);},4000);
}
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/`/g,'\\`');}
</script>
